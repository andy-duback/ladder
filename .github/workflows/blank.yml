name: Update dashboard

on:
  schedule:
    - cron: "37 21 * * 1-5"
    - cron: "13 1 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ladder-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Apply add / done / remove requests
        run: python3 scripts/manage.py apply

      - name: Fetch prices
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --upgrade yfinance
          "$RUNNER_TEMP/venv/bin/python" scripts/update_prices.py

      - name: Save changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holdings.csv data/prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update holdings and prices"
            git push
          fi

      - name: Reply to requests
        if: always()
        run: python3 scripts/manage.py reply

      - name: Assemble site
        if: always()
        run: |
          mkdir -p _site/data
          cp index.html holdings.csv strategy.json _site/
          cp data/prices.json _site/data/

      - uses: actions/upload-pages-artifact@v4
        if: always()
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        if: always()
        id: deploy
